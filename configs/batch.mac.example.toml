# Example expected paths for one native Espressif USB interface.
# Check actual USB serial/by-id data on your host; this is not a universal rule.
# Generate a fresh file using batch-generate and your existing device profiles.
# --baud and --output-dir are always written, with defaults 115200 and runs.
[batch]
duration = "24h"
baud = 115200
# Relative to the batch launch directory; includes all reports and evidence.
# Profile config paths below are relative to this TOML file instead.
output_dir = "runs"
wait_port = true
wait_port_timeout = "infinite"

# UNVERIFIED expected path until matching USB serial metadata is observed.
[[devices]]
slot = "urban-1051db010d54"
model = "urban"
port = "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_10:51:DB:01:0D:54-if00"
config = "urban.example.toml"
expected_mac = "10:51:DB:01:0D:54"

# UNVERIFIED expected path until matching USB serial metadata is observed.
[[devices]]
slot = "insight-1051db010c70"
model = "insight"
port = "/dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_10:51:DB:01:0C:70-if00"
config = "insight.example.toml"
expected_mac = "10:51:DB:01:0C:70"
