# L3 uses these cadence thresholds for measurement freshness; heartbeat repeats do not count.
# Sensor presets require metrics from each named physical JSON source.
# Compact PAYLOAD alone cannot confirm sensors; use metrics-only for that scope.
[expect]
sensors = ["scd41", "bme680"]
metrics = []

[range_checks]
warn_on_unknown = false
unknown_non_negative_metrics = ["aqi", "gas", "radiation"]

[sensor_ranges.temperature]
name = "temperature_c"
minimum = -40.0
maximum = 85.0

[sensor_ranges.humidity]
name = "humidity_percent"
minimum = 0.0
maximum = 100.0

[sensor_ranges.pressure]
name = "pressure_hpa"
minimum = 850.0
maximum = 1100.0

[sensor_ranges.co2]
name = "co2_ppm"
minimum = 350.0
maximum = 10000.0

# BME680 VOC scale/indicator/counter constants are allowed; cadence still applies.
# Default integer ranges: voc_ppb 0..10000, index 0..100, level 0..3
# (unavailable -1 warns), daily count 0..65535. voc_ppb is relative MOS/ABC,
# not laboratory TVOC; older firmware may omit it. Fields are not mandatory.
# Override these bounds through the existing sensor_ranges mechanism.
[sensor_ranges.voc_ppb]
name = "voc_ppb"
minimum = 0.0
maximum = 10000.0

[flatline]
window = "30m"
fail_after = "1h"
min_distinct_values = 2

[cadence]
expected_interval = "5m"
warn_after_missed = 2
fail_after_missed = 4

[serial]
silence_warn_after = "2m"
silence_fail_after = "10m"

[log_contract]
startup_window = "10m"

[uploads]
connectivity = "optional"
datalog = "optional"

[uploads.connectivity_thresholds]
min_successes = 1
min_success_rate = 0.8
max_consecutive_failures = 5

[uploads.datalog_thresholds]
min_successes = 1
min_success_rate = 0.8
max_consecutive_failures = 3
