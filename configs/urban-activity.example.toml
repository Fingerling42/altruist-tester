# Limited activity acceptance: overall WARN; measurement validity remains unverified.
# UART v2 uses per-sensor intervals below; repeated cache is not a measurement.
# Sensor presets require metrics from each named physical JSON source.
# UART v2 settings below are operator expectations, never learned from the device.
[expect]
sensors = ["bme280", "sds", "ics-43434"]
metrics = []

[range_checks]
warn_on_unknown = false
unknown_non_negative_metrics = ["aqi", "gas", "radiation"]

[sensor_ranges.temperature]
name = "temperature_c"
minimum = -40.0
maximum = 85.0

[sensor_ranges.humidity]
name = "humidity_percent"
minimum = 0.0
maximum = 100.0

[sensor_ranges.pressure]
name = "pressure_hpa"
minimum = 850.0
maximum = 1100.0

[sensor_ranges.P1]
name = "pm_ug_m3"
minimum = 0.0
maximum = 2000.0

[sensor_ranges.P2]
name = "pm_ug_m3"
minimum = 0.0
maximum = 2000.0

[sensor_ranges.noiseAvg]
name = "noise_dba"
minimum = 20.0
maximum = 130.0

[sensor_ranges.noiseMax]
name = "noise_dba"
minimum = 20.0
maximum = 130.0

[flatline]
window = "30m"
fail_after = "1h"
min_distinct_values = 2

[serial]
silence_warn_after = "2m"
silence_fail_after = "10m"

[log_contract]
startup_window = "10m"

[uploads]
connectivity = "optional"
datalog = "optional"

[uploads.connectivity_thresholds]
min_successes = 1
min_success_rate = 0.8
max_consecutive_failures = 5

[uploads.datalog_thresholds]
min_successes = 1
min_success_rate = 0.8
max_consecutive_failures = 3

# Select the firmware contract and set effective values before capture.
# These examples assume send=30000 ms, SDS=300000 ms and enabled gas on Insight.
# BUILD is saved separately; an unknown BUILD is never mapped to a local checkout.
[observations]
activity_only = ["ICS43434.main"]
firmware_source = "Altruist debug UART v2"
settings_rule = "BME/SCD max(300000,send); SDS max(30000,SDS); noise fetch=100"

[observations.settings.BME280]
fetch_wait_ms = 300000
measurement_interval_ms = 300000
publication = "on_update"
publish_interval_ms = 0
state_min_interval_ms = 1000

[observations.settings.SDS]
fetch_wait_ms = 1000
measurement_interval_ms = 300000
publication = "on_update"
publish_interval_ms = 0
state_min_interval_ms = 1000
sds_warmup_ms = 15000
sds_collect_ms = 5000

[observations.settings.ICS43434]
fetch_wait_ms = 100
publication = "coalesced"
publish_interval_ms = 30000
state_min_interval_ms = 1000
sds_warmup_ms = 15000
sds_collect_ms = 5000
noise_window_active_ms = 300000
