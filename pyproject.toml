[project]
name = "altruist-tester"
version = "0.1.0"
description = "USB-C serial burn-in tester for Altruist devices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "typer>=0.26.7",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
altruist-tester = "altruist_tester.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["altruist_tester"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
  ".venv",
  "data",
  "cache",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"